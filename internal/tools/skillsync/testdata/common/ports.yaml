    skill: acme-kit-py
    column: Py
    language: Python
    install: pip install acme-kit
    toolchain: Python 3.11+
    keywords: [python]
  - component: kit-rs
    skill: acme-kit-rs
    column: Rust
    language: Rust
    install: cargo add acme-kit
    toolchain: Rust 1.89+
    keywords: [rust]
  - component: kit-php
    skill: acme-kit-php
    column: PHP
    language: PHP
    install: composer require acme/kit
    toolchain: PHP 8.4+
    keywords: [php]
no_skill: [tasks]
copies:
  - from: skills/acme-kit/scripts/detect.sh
    to: scripts/detect.sh
    skills: [ports]
