name: shared
description: "Shared infrastructure (CI, devcontainer, gitignore, docs, scripts)"
kit_version: ">=0.4.0"

variables:
  - name: Name
    prompt: "Project name (lowercase, hyphens)"
    required: true
    validate: "^[a-z][a-z0-9-]{0,63}$"
  - name: Description
    prompt: "One-line description"
    default: "A {{.Name}} project"
  - name: Module
    prompt: "Source repo prefix (e.g. github.com/org)"
    default: "github.com/{{.Org}}/{{.Name}}"
  - name: Author
    prompt: "Author name"
    required: true
  - name: Email
    prompt: "Author email"
    required: true
  - name: Year
    prompt: "Copyright year"
    default: "{{.Year}}"
  - name: License
    type: choice
    choices: [MIT, Apache-2.0, BSD-3-Clause, Proprietary]
    default: MIT

files:
  exclude:
    - "kit-template.yaml"
    - "tiers.yaml"
    - "README.md"
    - "init.sh"
    - "ci/README.md"
    - "devcontainer/README.md"
    - "docs/README.md"
    - "scripts/README.md"
    # Managed-block emitter machinery: consumed by `kit init --update`
    # from the embedded copy, never rendered into projects. Several are
    # bash/bats with {{...}}-shaped content that trips text/template.
    - "emit-*.sh"
    - "*.bats"
    - "apply-services.sh"
    # Experimental CI templates carrying GitHub-Actions ${{ }} syntax
    # that collides with text/template; no core runtime selects them.
    - "ci/ci-kotlin.yml.tmpl"
    - "ci/ci-swift.yml.tmpl"
    - "managed-block.sh"
    - "tool-versions.toml"
    - "services/*"
    - "services/env/*"
    - "devcontainer/*"
  binary: []

render_rules:
  strip_suffixes: [".tmpl"]
  remove_after_render:
    - "kit-template.yaml"
    - "tiers.yaml"
  license:
    var: License
    target: LICENSE
    sources:
      MIT: LICENSE-MIT
      Apache-2.0: LICENSE-Apache-2.0

hooks: {}
