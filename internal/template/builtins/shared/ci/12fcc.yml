# Adopter: fetch from hop-top/poly-kit and save as
# .github/workflows/12fcc.yml
#
# 12-Factor AI-CLI conformance gate over the hop-top/spec-12fc composite
# action: verify-no-leak + verify-stories (+ cassette grading when a
# cassette-dir is configured), aggregated report, per-factor matrix,
# shields.io badge (.12fc.json), SARIF annotations, sticky PR comment.
#
# Follow-ups after fetching:
#   - paths: scope to your command-surface tree (cmd/ for Go CLIs).
#   - The badge stays "ungradable" until story docs exist — with zero
#     scannable files the leaves pass vacuously. Author story docs,
#     then flip commit-badge to true in the push job so the badge
#     reflects a real grade.
#   - Re-pin the action SHA to the @v1 tag once spec-12fc cuts a release.
name: 12fcc

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; jobs grant only what they need.
permissions:
  contents: read

jobs:
  # PR runs: annotate + comment, no repo write.
  conformance:
    name: 12-factor AI-CLI conformance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # sticky PR comment
      security-events: write   # SARIF upload to code-scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so --diff=auto resolves base

      # Pinned to a full commit SHA (supply-chain hardening); spec-12fc
      # has no release tag yet.
      - uses: hop-top/spec-12fc@fbd05973d8c0ec1acd9b20994d3db9bbfc3ac141 # main @ 2026-07-02
        with:
          command: all
          paths: cmd/
          diff: ""            # scan paths, not PR diff; --diff+--paths are mutually exclusive
          fail-on: 2,3,5
          upload-sarif: true
          pr-comment: true
          commit-badge: false

  # Push-to-main: same check; flip commit-badge to true once story-doc
  # collateral exists (see header note) so pushes refresh .12fc.json.
  conformance-badge:
    name: 12-factor AI-CLI conformance (badge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read           # commit-badge:true additionally needs contents:write
      security-events: write   # SARIF upload to code-scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hop-top/spec-12fc@fbd05973d8c0ec1acd9b20994d3db9bbfc3ac141 # main @ 2026-07-02
        with:
          command: all
          paths: cmd/
          diff: ""
          fail-on: 2,3,5
          upload-sarif: true
          pr-comment: false
          commit-badge: false
