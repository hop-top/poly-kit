name: CI (PHP)

on:
  push:
    branches: [main]
    paths: ["**.php", "composer.json", "composer.lock", "phpstan.neon", "phpunit.xml"]
  pull_request:
    branches: [main]
    paths: ["**.php", "composer.json", "composer.lock", "phpstan.neon", "phpunit.xml"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # PHP comes from setup-php, not mise (mise builds PHP from
      # source); ubuntu-latest ships an older PHP than composer.json's
      # floor. Keep php-version equal to that floor.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: composer install
        run: mise exec -- make setup

      - name: phpstan
        run: mise exec -- make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # PHP comes from setup-php, not mise (mise builds PHP from
      # source); ubuntu-latest ships an older PHP than composer.json's
      # floor. Keep php-version equal to that floor.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: composer install
        run: mise exec -- make setup

      - name: phpunit
        run: mise exec -- make test
