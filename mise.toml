# Managed by `kit init` — tools below the kit-managed marker are tracked
# against the kit tool-versions manifest. Add your own tools above the
# marker. Run `kit init --update` to refresh managed tools.
#
# This repo's own toolchain source of truth, with .config/mise.toml (tools
# only this repo's CI uses): CI reads these pins (scripts/toolchain-pins.sh),
# and `make check-toolchain-parity` fails when go.mod, rust-toolchain.toml,
# a workflow, the devcontainer or the scaffold manifest
# (templates/shared/tool-versions.toml, which the block below is emitted
# from) disagrees, or a pin is not an exact release.

# >>> kit-managed >>>
[tools]
go = "1.27.3"
node = "24.22.1"
pnpm = "12.16.0"
python = "3.14.10"
uv = "0.13.6"
rust = "1.99.0"
golangci-lint = "2.14.0"
ruff = "0.17.1"
lychee = "0.24.2"
hadolint = "2.12.0"
actionlint = "1.7.12"
shellcheck = "0.10.0"
shfmt = "3.10.0"
"npm:release-please" = "17.11.2"

[env]
_.file = ".env"

[tasks.install]
description = "Install ecosystem dependencies (orchestrated by mise)"
run = [
  "go mod download",
  "pnpm install",
  "uv sync",
  "cargo fetch"
]
# <<< kit-managed <<<
