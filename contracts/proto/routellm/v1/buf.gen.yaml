# buf.gen.yaml — codegen config for routellm protos
# Run: make proto (or buf generate in this directory)
#
# Plugin versions are pinned so `make proto-check` is reproducible:
# protocolbuffers/go tracks google.golang.org/protobuf as pinned in
# go.mod; grpc/go is protoc-gen-go-grpc, versioned apart from
# google.golang.org/grpc, pinned to the release that produced gen/go.
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: gen/go
    opt: paths=source_relative
