# Plugin versions are pinned so `make proto-check` is reproducible:
# protocolbuffers/go tracks google.golang.org/protobuf, connectrpc/go
# tracks connectrpc.com/connect, both as pinned in go.mod; bufbuild/es
# tracks @bufbuild/protobuf in sdk/ts/package.json. connectrpc/es has
# no v2 release (protoc-gen-es v2 generates services itself); it stays
# on the last v1 plugin, which produced sdk/ts/src/gen/crud_connect.ts.
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: .
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.11.0
    out: ../../../../sdk/ts/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../../../../sdk/ts/src/gen
    opt: target=ts
