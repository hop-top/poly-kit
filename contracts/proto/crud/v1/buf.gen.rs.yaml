# Rust stubs for kit-rs (feature `rpc-server`), generated separately from
# buf.gen.yaml because these are LOCAL plugins: build them from crates.io
# at the pinned versions and put them on PATH, then `make proto-rs`.
#
#   cargo install --locked protoc-gen-buffa@0.9.2 protoc-gen-buffa-packaging@0.9.2 \
#     connectrpc-codegen@0.9.0   # installs protoc-gen-connect-rust
#
# crates.io checksums (sha256) of the pinned plugin sources:
#   protoc-gen-buffa 0.9.2            ad0eef58b1f62b0813c1bf028cf1c68a60fd3d250059218b2d6f2683d9139367
#   protoc-gen-buffa-packaging 0.9.2  4fb7570694ccde8570c6f8d7a07ffdf485dca7f498a8775c7aa51240a97aabd9
#   connectrpc-codegen 0.9.0          514a7a6fbe705d532ddf490c221db7bd52c5b94fd691cb257a7c18e5646355bb
#
# The runtime pins in sdk/experimental/rs/Cargo.toml (connectrpc =0.9.1,
# buffa =0.9.2) track these: bump them together, then regenerate. The
# generated code names crate::rpc::proto, where kit-rs mounts the buffa
# tree. No build.rs, no protoc at build time.
version: v2
plugins:
  - local: protoc-gen-buffa
    out: ../../../../sdk/experimental/rs/src/rpc/gen/buffa
    opt: [views=true, json=true]
  - local: protoc-gen-buffa-packaging
    out: ../../../../sdk/experimental/rs/src/rpc/gen/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: ../../../../sdk/experimental/rs/src/rpc/gen/connect
    opt: [buffa_module=crate::rpc::proto]
  - local: protoc-gen-buffa-packaging
    out: ../../../../sdk/experimental/rs/src/rpc/gen/connect
    strategy: all
    opt: [filter=services]
