# Adopter: copy to .github/workflows/conformance-grade.yml
# Requires:
#   secrets.KIT_CONFORMANCE_TOKEN — bearer for the grading service
#   GITHUB_TOKEN — supplied automatically by GitHub Actions
# Assumes the harness-based test at ./e2e/conformance records a
# cassette at ./testdata/cassettes/conformance.
name: conformance-grade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<
      - name: install kit
        run: mise exec -- go install hop.top/kit/cmd/kit@latest
      - name: record cassette
        run: mise exec -- go test ./e2e/conformance/...
      - name: grade
        env:
          KIT_CONFORMANCE_TOKEN: ${{ secrets.KIT_CONFORMANCE_TOKEN }}
          KIT_CONFORMANCE_SERVICE: ${{ vars.KIT_CONFORMANCE_SERVICE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise exec -- kit conformance grade \
            ./testdata/cassettes/conformance \
            --format=json \
            --pr-comment \
            --status-check \
            --output=/tmp/grade-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: conformance-grade-result
          path: /tmp/grade-result.json
