name: CI (Python)

on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "requirements*.txt", "uv.lock", "Makefile", ".ruff.toml", "mise.toml", ".github/workflows/ci-py.yml"]
  pull_request:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "requirements*.txt", "uv.lock", "Makefile", ".ruff.toml", "mise.toml", ".github/workflows/ci-py.yml"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Lint (ruff check + format check)
        run: mise exec -- make lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Mypy
        run: mise exec -- make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Pytest
        run: mise exec -- make test
