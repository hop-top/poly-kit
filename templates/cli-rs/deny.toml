# cargo-deny policy for `make audit`. Reference:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# Every RustSec advisory fails, including unmaintained and yanked
# crates. Ignore one only with its ID and a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
# Permissive licenses only. Adding one is a licensing decision, not a
# build fix.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
