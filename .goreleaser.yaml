version: 2
project_name: kit

# Builds the `kit` binary for every `kit/v<version>` release. publish.yml
# runs this through hop-top/.github goreleaser-on-tag.yml, which
# synthesizes a bare `v<version>` tag for GoReleaser and uploads
# dist/*.tar.gz, dist/*.zip and dist/checksums.txt to the real
# `kit/v<version>` release itself.
#
# The engine SDKs (engine/sdk/py-kit-engine, engine/sdk/ts-kit-engine)
# download `kit_<os>_<arch>.<tar.gz|zip>` and verify it against
# checksums.txt from that release: keep the archive names versionless
# and the checksum file name as is, or the SDK auto-download breaks.

builds:
  - id: kit
    main: ./cmd/kit
    binary: kit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kit
    ids: [kit]
    name_template: >-
      kit_{{.Os}}_{{.Arch}}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  # release-please writes the changelog.
  disable: true

release:
  # GoReleaser OSS cannot publish to the prefixed `kit/v<version>`
  # release; goreleaser-on-tag.yml uploads the archives instead.
  disable: true
