target-version = "py310"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "BLE",    # blind except
    "S110",   # try-except-pass
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF002", # ambiguous unicode chars in docstrings (en dash etc)
]

[format]
quote-style = "double"
