# osv-scanner configuration, read by .github/workflows/vulnerability-scan.yml.
# A bare `osv-scanner scan source -r .` from the repo root picks it up too.
#
# An entry names one advisory and says why it does not apply here. Nothing
# is ignored in bulk, and an advisory with a fix is never listed: bump the
# dependency instead.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = """
Advisory covers golang.org/x/crypto/openpgp, which is unmaintained and has
no fixed release, and it is filed against the whole module. No package in
this repository's build graph, tests included, imports openpgp; govulncheck
reports it as required but never imported. Remove this entry when the
advisory is withdrawn or narrowed to the package.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
reason = """
Informational, not a vulnerability: unsafe-libyaml is unmaintained and has
no fixed release. It reaches sdk/rs/Cargo.lock only as a dev-dependency,
through hop-top-xrr's serde_yaml 0.9, which reads the committed test
cassettes under sdk/rs/tests/cassettes; nothing shipped links it. Remove this
entry once hop-top-xrr moves off serde_yaml.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = """
Informational, not a vulnerability: chrono 0.4.45 is unmaintained and has no
fixed release. kit's own timeutil, interim and the MCP vocabulary no longer
use it. It stays in sdk/rs/Cargo.lock only as a dev-dependency, through
hop-top-xrr's cassette timestamps (two `Utc::now()` calls); nothing shipped
links it. Remove this entry once hop-top-xrr drops chrono and kit pins that
release.
"""
