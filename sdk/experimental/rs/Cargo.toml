[package]
name = "hop-top-kit"
version = "0.5.0-alpha.2"
edition = "2021"
license = "MIT"
description = "Cross-language CLI UX parity toolkit"

[features]
default = []
# The netpolicy guarded client lives beneath `api`: it owns the reqwest
# client construction path for user traffic, so anything that issues
# such a request necessarily compiles it in. The telemetry HTTPS sink
# builds its own client and is deliberately unguarded (logging-class
# egress). `thiserror` supplies the client's error type. No direct
# tokio: nothing here names it, and reqwest brings its own.
api = ["netpolicy", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror"]
# The policy decision alone: `NetPolicy`, loopback classification, the
# dial check and the typed refusal. No dependencies, wasm-safe, so a
# client that dials its own sockets (websocket, SMTP, SQL) can enforce
# `--offline` without compiling reqwest or tokio.
netpolicy = []
blob = ["dep:thiserror"]
uri = ["dep:hop-top-cite"]
# preserve_order backs serde_json::Map with indexmap instead of BTreeMap, so
# object key order survives round-trips and projection at every nesting depth.
# Required for --format=json/yaml to emit columns in ColumnSpec / --cols order
# rather than alphabetically. indexmap is already in the tree via serde_yaml.
# Scoped to `output`: Cargo unifies features, so enabling it from the base
# dependency would flip Map ordering for every crate in a consumer's build.
output = [
    "dep:serde",
    "dep:serde_json",
    "serde_json/preserve_order",
    "dep:serde_yaml",
    "dep:thiserror",
    "dep:comfy-table",
]
cli = ["output", "dep:clap"]
id = ["dep:mti", "dep:uuid", "dep:serde", "dep:thiserror"]
bus = ["dep:serde", "dep:serde_json"]
sqldb = ["dep:rusqlite", "dep:thiserror"]
httpcache = ["kv", "dep:serde", "dep:serde_json", "dep:sha2", "dep:base64"]
# Dual-spec MCP surface. `rmcp` supplies the protocol vocabulary (version
# constants, the -3202x error codes, reserved _meta keys) with
# default-features off, so the server/tokio/hyper stack stays out of the
# tree: this port hosts via a plain request->response fn, not rmcp's
# transports. Consumers who do not serve MCP compile none of it.
mcp = ["dep:serde", "dep:serde_json", "dep:rmcp"]
# Builds on sqldb for connection setup, pragmas and the SQLite engine —
# no dependencies of its own.
kv = ["sqldb"]
sqlstore = ["sqldb", "dep:serde", "dep:serde_json"]
# Backup/restore through a blob backend. Opt-in so a consumer that only
# needs local `.dbs/` file backups does not compile the blob module.
sqlstore-blob = ["sqlstore", "blob"]
# At-rest value encryption. Opt-in so the base store stays free of the
# crypto dependency tree.
sqlstore-encrypt = ["sqlstore", "dep:crypto_secretbox", "dep:hkdf", "dep:sha2"]
timeutil = ["dep:chrono", "dep:interim", "dep:thiserror"]
# Serve hierarchy + service lifecycle. Builds on `output` for the
# exit-code taxonomy (CliError) and on tokio for the async supervisor:
# `serve` is by definition a long-running concurrent surface, so there
# is no non-async shape for it. Consumers who ship no services compile
# none of it.
#
# tokio carries only the pieces the supervisor uses (spawn, select!,
# channels and Notify, timers, signals); the consumer picks the runtime
# flavour.
serve = [
    "output",
    "dep:tokio",
    "tokio/rt",
    "tokio/macros",
    "tokio/sync",
    "tokio/time",
    "tokio/signal",
    "dep:serde_json",
]
# The `serve` command: mounts `serve [SERVICE]` with its flags on any
# clap root. Opt-in on top of `serve`, following `sqlstore-blob`, so a
# consumer wiring the lifecycle into its own parser does not compile
# clap.
serve-cli = ["serve", "cli"]
telemetry = [
    "api",
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/fs",
    "tokio/io-util",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:getrandom",
    "dep:dirs",
    "dep:regex",
    "dep:thiserror",
]

# Layered YAML configuration, a port of go/core/config. Parsing, merge,
# scalar resolution, overrides and precedence are pure and wasm-safe;
# file loading, paths, Set/Unset and reload are compiled off wasm32 only.
# Builds on `bus` for reload topics and events.
config = ["bus", "dep:serde", "dep:serde_json", "dep:saphyr-parser"]
# The pure half of go/core/config/pkl (schema parse, validation,
# completion) plus `resolve`, which shells out to the `pkl` binary.
config-pkl = ["config", "dep:regex"]
# Signal-driven hot reload (`Reloadable::watch_signal`). Unix only;
# brings tokio's signal driver, which `serve` already uses.
config-signal = [
    "config",
    "dep:tokio",
    "tokio/rt",
    "tokio/macros",
    "tokio/signal",
    "tokio/sync",
]

[dependencies]
hop-top-cite = { version = "0.1.0", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
], optional = true }
interim = { version = "0.2", default-features = false, features = [
    "std",
    "chrono_0_4",
], optional = true }
# Proxies come from the environment only (HTTP_PROXY etc.), as with Go net/http;
# no system-proxy, which pulls macOS/Windows proxy settings and an old core-foundation.
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset", "http2", "json", "query"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# No crate-wide features: `output` adds preserve_order for itself.
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
sha2 = { version = "0.11", optional = true }
# `default-features = false` drops the std/simd defaults: the envelope
# codec needs only the standard alphabet, and `alloc` is what supplies
# encode/decode to owned buffers.
base64 = { version = "0.23", default-features = false, features = [
    "alloc",
], optional = true }
# RustCrypto HKDF. Moves in lockstep with sha2: hkdf 0.13 and sha2 0.11 are
# the `digest` 0.11 generation, and `Hkdf<Sha256>` only resolves when both
# sit on the same one. Bump them together or not at all.
hkdf = { version = "0.13", default-features = false, optional = true }
# NaCl secretbox (XSalsa20-Poly1305), the wire format the Go side uses.
# RustCrypto's pure-Rust implementation: no libsodium C build, unlike
# `dryoc`/`sodiumoxide`, and two orders of magnitude more downloads than
# either. `default-features = false` drops `alloc`'s transitive std pull;
# `getrandom` supplies the OS RNG for nonces and `salsa20` the cipher core.
crypto_secretbox = { version = "0.1", default-features = false, features = [
    "alloc",
    "getrandom",
    "salsa20",
], optional = true }
getrandom = { version = "0.4", optional = true }
# YAML event parser with source spans. Spans drive the comment-keeping
# editor behind `set`/`unset`; scalars resolve through this crate's own
# yaml.v3-compatible rules, not the parser's. Exact pin: 0.x and the
# editor depends on span semantics.
saphyr-parser = { version = "=0.1.0", optional = true }
dirs = { version = "7", optional = true }
# No crate-wide features: each feature that uses tokio names the pieces it
# needs, so `full` (and its socket, process and multi-thread runtime
# stack) never reaches a consumer through this crate.
tokio = { version = "1", optional = true }
regex = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
rmcp = { version = "3.1.4", default-features = false, optional = true }
clap = { version = "4", features = ["derive", "string"], optional = true }
comfy-table = { version = "8", default-features = false, optional = true }
mti = { version = "1.1.1", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v7", "serde"], optional = true }
# `bundled` compiles SQLite from source: no libsqlite3 on the build host,
# and a pinned engine version so pragma/WAL behaviour is identical across
# platforms and CI runners. Matches the Go side's pure-Go driver posture.
# `default-features = false` drops the unused statement cache (hashlink)
# and the wasm ffi shim.
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled",
], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# No extra features: dev-dependency features unify into the test build, so
# preserve_order here would hide a feature set the shipped crate does not
# have. Tests that need ordering get it from `output`.
serde_json = "1"

# Native-only: none of these builds for wasm32-unknown-unknown, and the
# wasm test build (tests/bus_wasm.rs) compiles every dev-dependency.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1"
tempfile = "3"
uuid = { version = "1", features = ["v7", "serde"] }

# The wasm32 smoke test (tests/bus_wasm.rs, `make test-rs-wasm`), run
# under Node by wasm-bindgen-test-runner. Exact pins: each must match the
# wasm-bindgen in Cargo.lock, and so must the wasm-bindgen-cli CI installs.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"
wasm-bindgen-futures = "=0.4.71"

# A real process serving a real listener, driven by the smoke test in
# tests/serve_command.rs. Cargo sets no CARGO_BIN_EXE_* for examples,
# so that test builds it itself.
[[example]]
name = "serve"
required-features = ["serve-cli"]
