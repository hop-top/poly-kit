name: Release Promotion Gate

on:
  pull_request:
    paths:
      - '.github/release-please-config.json'

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate promotion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Who may promote is the repo's ordinary PR policy; the config is
          # not code-owned. This gate only validates transition logic.

          # Skip validation for initial config setup
          if ! git show "${BASE_SHA}":.github/release-please-config.json \
               >/dev/null 2>&1; then
            echo "Initial release-please setup — skipping" \
              "promotion validation"
            exit 0
          fi

          DIFF=$(git diff "${BASE_SHA}" -- .github/release-please-config.json)
          CHANGED=$(echo "$DIFF" \
            | grep "^[+-]" \
            | grep -v "^[+-][+-][+-]" \
            | grep -v "^$" || true)

          # A PR that leaves prerelease-type alone is config maintenance,
          # not a channel promotion; there is no transition to validate.
          if ! echo "$CHANGED" | grep -q "prerelease-type"; then
            echo "prerelease-type unchanged — not a promotion PR," \
              "nothing to validate"
            exit 0
          fi

          # Validate only prerelease-type changed
          NON_PRERELEASE=$(echo "$DIFF" \
            | grep "^[+-]" \
            | grep -v "^[+-][+-][+-]" \
            | grep -v "prerelease-type" \
            | grep -v "^$" || true)

          if [ -n "$NON_PRERELEASE" ]; then
            echo "::error::Release promotion PR must only" \
              "change prerelease-type"
            exit 1
          fi

          # Validate all packages share the same prerelease-type
          TYPES=$(jq -r '
            [.packages | to_entries[]
              | .value["prerelease-type"] // "release"]
            | unique | length' .github/release-please-config.json)

          if [ "$TYPES" -ne 1 ]; then
            echo "::error::All packages must share the same" \
              "prerelease-type"
            exit 1
          fi

          # Validate transition. prerelease-type carries a counter suffix
          # ("alpha.0", not "alpha") — without it release-please skips the
          # first prerelease and starts at alpha.1 — so compare the channel
          # only, up to the first dot.
          OLD_STAGE=$(git show "${BASE_SHA}":.github/release-please-config.json \
            | jq -r '.packages["."]["prerelease-type"] // "release" | split(".")[0]')
          NEW_STAGE=$(jq -r \
            '.packages["."]["prerelease-type"] // "release" | split(".")[0]' \
            .github/release-please-config.json)

          case "${OLD_STAGE}→${NEW_STAGE}" in
            "release→alpha"|"alpha→beta"|"beta→rc"|"rc→release")
              echo "Valid promotion: ${OLD_STAGE} → ${NEW_STAGE}"
              ;;
            *)
              echo "::error::Invalid promotion:" \
                "${OLD_STAGE} → ${NEW_STAGE}"
              exit 1
              ;;
          esac
