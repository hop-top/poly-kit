name: Release Promotion Gate

# Guards the release state a PR can change (RELEASING.md):
#
# - .github/.release-please-manifest.json is written by release PRs only: a
#   PR from a release-please-- branch opened by the release bot. A merge
#   between this repository's own next and main carries what release PRs
#   wrote there: a PR from one into the other (not a fork's branch of that
#   name; promotion merges and forward-ports), or a topic branch resolving
#   such a merge, each entry the base's or the other branch's. Any other PR
#   that changes it fails, whatever the base branch; no version is ever
#   hand-picked.
# - Promotions: changes to the x-channel / x-open-line records in
#   .github/release-please-config.json. On a prerelease branch (target-context
#   prereleaseBranches, default next) a PR that changes those records must
#   change nothing else in the config, and every record it adds or changes
#   must be the one bin/promote.js writes: the package's current target as
#   the line, one channel step (alpha → beta → rc) from the channel the
#   manifest shows, never backwards, an open line not reached yet. Removing a
#   record (promote.js clear, or a release PR leaving the line) passes. On
#   any other branch the records are inert and the preflight checks their
#   shape only.
#
# The verdict rests on the PR's base commit only: the branch roles, the
# config and manifest the records are replayed on, and the replaying
# scripts/promote-release.sh with the hop-top/.github pin it reads from
# release-please.yml (the code the release run uses; fetched on the first
# replay). A PR cannot edit them to pass. This file itself runs as the PR
# has it (pull_request), like every workflow: review changes to it.
#
# No `paths:` filter: the gate runs on every PR and exits early when neither
# file changed, so `validate-promotion` can be a required check. Who may
# promote is the repo's ordinary PR policy; the config is not code-owned.

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-promotion:
    name: validate-promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Validate promotion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          CONFIG=.github/release-please-config.json
          MANIFEST=.github/.release-please-manifest.json
          RELEASE_BOT='hop-top-release-bot[bot]'
          W=$(mktemp -d)
          trap 'rm -rf "$W"' EXIT

          # resolved_from <branch>: every entry of the PR's manifest (added,
          # changed or removed) is the base's or origin/<branch>'s: a merge
          # with <branch>, conflicts resolved on a topic branch.
          resolved_from() {
            git show "origin/$1:$MANIFEST" > "$W/other.json" 2>/dev/null &&
              jq -e -n --slurpfile b "$W/manifest.json" --slurpfile o "$W/other.json" \
                --slurpfile h "$MANIFEST" '
                $b[0] as $b | $o[0] as $o | $h[0] as $h
                | ([$b, $o, $h] | all(type == "object"))
                  and ([($b + $h) | keys[]] | unique | all(. as $k | $h[$k] == $b[$k] or $h[$k] == $o[$k]))' \
                >/dev/null 2>&1
          }

          # The manifest is written by release PRs only, and travels with
          # merges between this repository's own next and main (either
          # direction). No manifest on the base: initial setup, adding one is
          # allowed.
          case "$BASE_REF" in
            next) other=main ;;
            main) other=next ;;
            *) other= ;;
          esac
          base_manifest=false
          if git show "$BASE_SHA:$MANIFEST" > "$W/manifest.json" 2>/dev/null; then
            base_manifest=true
            if [ -f "$MANIFEST" ] && cmp -s "$W/manifest.json" "$MANIFEST"; then
              :
            elif [[ "$HEAD_REF" == release-please--* && "$PR_AUTHOR" == "$RELEASE_BOT" ]]; then
              echo "ok: $MANIFEST changed by a release PR"
            elif [ -n "$other" ] && [ "$HEAD_REF" = "$other" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
              echo "ok: $MANIFEST changed by a merge from $HEAD_REF"
            elif [ -n "$other" ] && resolved_from "$other"; then
              echo "ok: $MANIFEST: every entry is $BASE_REF's or $other's (a merge with $other)"
            else
              echo "::error file=$MANIFEST::the manifest is written by release PRs only (release-please--* branches opened by $RELEASE_BOT) and travels with merges between this repository's next and main, each entry the base's or the other branch's; no version is hand-picked: drop the change to $MANIFEST (a channel step or a new line goes through scripts/promote-release.sh)"
              exit 1
            fi
          fi

          if ! git show "$BASE_SHA:$CONFIG" > "$W/base.json" 2>/dev/null; then
            echo "no $CONFIG on the base: initial setup, nothing to validate"
            exit 0
          fi

          # Records are live only on a prerelease branch. The roles come from
          # the base config: a PR cannot turn the gate off by editing them.
          if ! jq -e --arg b "$BASE_REF" '
              ([(.plugins // [])[] | objects | select(.type == "target-context")][0] // {})
              | any((.prereleaseBranches // ["next"])[]?; . == $b)' "$W/base.json" >/dev/null; then
            echo "$BASE_REF is not a prerelease branch: x-channel / x-open-line records are inert there"
            exit 0
          fi

          # records <config>: every record as {p, k, v}, sorted
          records() {
            jq -cS '[(.packages // {}) | to_entries[] | .key as $p | .value | objects | to_entries[]
                     | select(.key == "x-channel" or .key == "x-open-line") | {p: $p, k: .key, v: .value}]
                    | sort_by(.p, .k)' "$1"
          }
          # rest <config>: the config without its records
          rest() { jq -cS '(.packages // {}) |= map_values(if type == "object" then del(.["x-channel"], .["x-open-line"]) else . end)' "$1"; }

          records "$W/base.json" > "$W/base.records"
          records "$CONFIG" > "$W/head.records"
          if cmp -s "$W/base.records" "$W/head.records"; then
            echo "no x-channel / x-open-line record changed: not a promotion"
            exit 0
          fi
          if [ "$(rest "$W/base.json")" != "$(rest "$CONFIG")" ]; then
            echo "::error file=$CONFIG::a promotion changes only x-channel / x-open-line records (scripts/promote-release.sh); this PR changes other keys of $CONFIG too: split them out"
            exit 1
          fi

          fail=0
          # Removed records: always valid.
          jq -r --slurpfile head "$W/head.records" \
            '.[] | select(. as $r | any($head[0][]; .p == $r.p and .k == $r.k) | not) | "\(.p) \(.k)"' \
            "$W/base.records" |
            while read -r p k; do echo "ok: $p: $k removed"; done

          # Added or changed records: replay the base's promote-release.sh
          # (and so the base's extension pin) on the base config and manifest.
          jq -r --slurpfile base "$W/base.records" \
            '.[] | select(. as $r | any($base[0][]; . == $r) | not) | [.p, .k, (.v | tojson)] | @tsv' \
            "$W/head.records" > "$W/changed.tsv"
          if [ ! -s "$W/changed.tsv" ]; then
            exit 0
          fi
          if ! $base_manifest; then
            echo "::error file=$MANIFEST::no $MANIFEST on the base: no channel to replay the records from"
            exit 1
          fi
          mkdir "$W/base"
          if ! git archive "$BASE_SHA" scripts/promote-release.sh .github/workflows/release-please.yml |
              tar -x -C "$W/base"; then
            echo "::error::cannot read scripts/promote-release.sh and .github/workflows/release-please.yml at the base ($BASE_SHA)"
            exit 1
          fi
          PROMOTE="$W/base/scripts/promote-release.sh"
          while IFS=$'\t' read -r p k v; do
            if [ "$k" = x-channel ]; then
              args=(channel "$(jq -r 'if type == "object" then (.channel // "") | tostring else "" end' <<<"$v")")
            else
              args=(open-line "$(jq -r 'if type == "string" then . else "" end' <<<"$v")")
            fi
            cp "$W/base.json" "$W/replay.json"
            rc=0
            out=$(bash "$PROMOTE" "${args[@]}" --package "$p" --config "$W/replay.json" \
              --manifest "$W/manifest.json" --no-commit 2>&1 </dev/null) || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::error::the base's scripts/promote-release.sh could not set up promote.js: ${out//$'\n'/; }"
              exit 1
            elif [ "$rc" -ne 0 ]; then
              echo "::error file=$CONFIG::$p: $k $v refused by promote.js: ${out//$'\n'/; }"
              fail=1
              continue
            fi
            want=$(jq -cS --arg p "$p" --arg k "$k" '.packages[$p][$k]' "$W/replay.json")
            if [ "$want" != "$(jq -cS . <<<"$v")" ]; then
              echo "::error file=$CONFIG::$p: $k $v is not what promote.js records from the base config: $want (scripts/promote-release.sh ${args[*]} --package $p)"
              fail=1
              continue
            fi
            echo "ok: $p: $k $v"
          done < "$W/changed.tsv"
          exit "$fail"
