name: Release Promotion Gate

# Validates promotion PRs under target versioning (RELEASING.md): changes to
# the x-channel / x-open-line records in .github/release-please-config.json.
#
# On a prerelease branch (target-context prereleaseBranches, default next) a
# PR that changes those records must change nothing else in the config, and
# every record it adds or changes must be the one bin/promote.js writes from
# the base config: the package's current target as the line, one channel
# step (alpha → beta → rc) from the channel the manifest shows, never
# backwards, an open line not reached yet. Removing a record (promote.js
# clear, or a release PR leaving the line) passes. On any other branch the
# records are inert and the preflight checks their shape only.
#
# promote.js runs from hop-top/.github at the commit release-please.yml pins
# (scripts/promote-release.sh --pin), the code the release run uses. Who may
# promote is the repo's ordinary PR policy; the config is not code-owned.

on:
  pull_request:
    paths:
      - '.github/release-please-config.json'

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the extension pin
        id: pin
        run: |
          ref=$(scripts/promote-release.sh --pin)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: hop-top/.github
          ref: ${{ steps.pin.outputs.ref }}
          path: .hop-top-dotgithub
          persist-credentials: false
          sparse-checkout: scripts/release-please-target

      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install the target-versioning extension
        working-directory: .hop-top-dotgithub/scripts/release-please-target
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate promotion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          PROMOTE: scripts/promote-release.sh
          RELEASE_PLEASE_TARGET_DIR: ${{ github.workspace }}/.hop-top-dotgithub/scripts/release-please-target
        run: |
          set -euo pipefail
          CONFIG=.github/release-please-config.json
          MANIFEST="$PWD/.github/.release-please-manifest.json"
          W=$(mktemp -d)
          trap 'rm -rf "$W"' EXIT

          if ! git show "$BASE_SHA:$CONFIG" > "$W/base.json" 2>/dev/null; then
            echo "no $CONFIG on the base: initial setup, nothing to validate"
            exit 0
          fi

          # Records are live only on a prerelease branch.
          if ! jq -e --arg b "$BASE_REF" '
              ([(.plugins // [])[] | objects | select(.type == "target-context")][0] // {})
              | any((.prereleaseBranches // ["next"])[]?; . == $b)' "$CONFIG" >/dev/null; then
            echo "$BASE_REF is not a prerelease branch: x-channel / x-open-line records are inert there"
            exit 0
          fi

          # records <config>: every record as {p, k, v}, sorted
          records() {
            jq -cS '[(.packages // {}) | to_entries[] | .key as $p | .value | objects | to_entries[]
                     | select(.key == "x-channel" or .key == "x-open-line") | {p: $p, k: .key, v: .value}]
                    | sort_by(.p, .k)' "$1"
          }
          # rest <config>: the config without its records
          rest() { jq -cS '(.packages // {}) |= map_values(if type == "object" then del(.["x-channel"], .["x-open-line"]) else . end)' "$1"; }

          records "$W/base.json" > "$W/base.records"
          records "$CONFIG" > "$W/head.records"
          if cmp -s "$W/base.records" "$W/head.records"; then
            echo "no x-channel / x-open-line record changed: not a promotion"
            exit 0
          fi
          if [ "$(rest "$W/base.json")" != "$(rest "$CONFIG")" ]; then
            echo "::error file=$CONFIG::a promotion changes only x-channel / x-open-line records (scripts/promote-release.sh); this PR changes other keys of $CONFIG too: split them out"
            exit 1
          fi

          fail=0
          # Removed records: always valid.
          jq -r --slurpfile head "$W/head.records" \
            '.[] | select(. as $r | any($head[0][]; .p == $r.p and .k == $r.k) | not) | "\(.p) \(.k)"' \
            "$W/base.records" |
            while read -r p k; do echo "ok: $p: $k removed"; done
          # Added or changed records: replay promote.js on the base config.
          while IFS=$'\t' read -r p k v; do
            if [ "$k" = x-channel ]; then
              args=(channel "$(jq -r 'if type == "object" then (.channel // "") | tostring else "" end' <<<"$v")")
            else
              args=(open-line "$(jq -r 'if type == "string" then . else "" end' <<<"$v")")
            fi
            cp "$W/base.json" "$W/replay.json"
            if ! out=$("$PROMOTE" "${args[@]}" --package "$p" --config "$W/replay.json" --manifest "$MANIFEST" --no-commit 2>&1); then
              echo "::error file=$CONFIG::$p: $k $v refused by promote.js: ${out//$'\n'/; }"
              fail=1
              continue
            fi
            want=$(jq -cS --arg p "$p" --arg k "$k" '.packages[$p][$k]' "$W/replay.json")
            if [ "$want" != "$(jq -cS . <<<"$v")" ]; then
              echo "::error file=$CONFIG::$p: $k $v is not what promote.js records from the base config: $want (scripts/promote-release.sh ${args[*]} --package $p)"
              fail=1
              continue
            fi
            echo "ok: $p: $k $v"
          done < <(jq -r --slurpfile base "$W/base.records" \
            '.[] | select(. as $r | any($base[0][]; . == $r) | not) | [.p, .k, (.v | tojson)] | @tsv' \
            "$W/head.records")
          exit "$fail"
