name: Mirror Sync

on:
  pull_request:
    paths:
      - '.github/workflows/mirror-sync.yml'
      - 'internal/template/builtins/**'
      - 'Makefile'
      - 'templates/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-sync.yml'
      - 'internal/template/builtins/**'
      - 'Makefile'
      - 'templates/**'

# A newer push to a pull request cancels its older run; the new run
# reports the same checks. Pushes, the schedule and manual runs get a
# group of their own (the run id), so none is cancelled or queued behind
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify mirror sync
        # Strict comparison: templates/ is canonical and the mirror must be
        # byte-identical to what `make builtins-sync` produces from it (a
        # verbatim copy, Markdown links leaving a template tree rebased; Go
        # sources ship as *.tmpl on both sides).
        run: make check-mirror-sync
