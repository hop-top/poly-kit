name: Mirror Sync

on:
  pull_request:
    paths:
      - '.github/workflows/mirror-sync.yml'
      - 'internal/template/builtins/**'
      - 'Makefile'
      - 'templates/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-sync.yml'
      - 'internal/template/builtins/**'
      - 'Makefile'
      - 'templates/**'

jobs:
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify mirror sync
        # Strict comparison: templates/ is canonical and the mirror must be a
        # byte-identical copy (Go sources ship as *.tmpl on both sides).
        run: make check-mirror-sync
