name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nightly full-count run of the engine/store property tests on the
  # default branch; pull requests trim them (see the go-test job).
  schedule:
    - cron: '0 3 * * *'

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # golangci-lint is installed by `make lint-go` -> `tools-golangci-lint`
      # at the version pinned by `GOLANGCI_LINT_VERSION` in the Makefile.
      # Single source of truth for local + CI.
      - run: make lint-go

  ts-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: make lint-ts

  py-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
      # --locked fails when uv.lock disagrees with pyproject.toml instead
      # of silently rewriting it. A plain `uv sync` masks lock drift in CI
      # and surfaces it later as an unrelated dirty file in contributor
      # trees. Mirrors `pnpm install --frozen-lockfile` in the ts jobs.
      - run: cd sdk/py && uv sync --all-extras --locked
      - run: cd engine/sdk/py-kit-engine && uv sync --all-extras --locked
      - run: make lint-lock-py
      - run: make lint-py

  rs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
      - run: make lint-rs

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - run: make lint-docs
      - run: make lint-readmes
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v${{ steps.pins.outputs.lychee }}
          args: '--config examples/spaced/lychee.toml docs/ README.md'
          fail: false
      - name: Fail on broken internal links
        run: lychee --offline docs/ README.md

  sdk-paths-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-sdk-paths

  adr-refs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-adr-refs

  internal-refs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-internal-refs

  actions-pinned-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-actions-pinned

  # mise.toml pins the toolchain and the jobs here read it. go.mod,
  # rust-toolchain.toml, uv.lock, workflow literals and the devcontainer
  # carry their own copies; this fails when one of them drifts.
  toolchain-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check-toolchain-parity

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      # buf only; lint, format and generate run inside `make proto-check`.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ steps.pins.outputs.buf }}
          setup_only: true
      # buf.gen.yaml uses remote plugins, and the Buf registry rate-limits
      # anonymous callers ("resource_exhausted: too many requests"). A
      # BUF_TOKEN repository secret lifts the limit; a maintainer adds it
      # (CONTRIBUTING.md, "Protobuf stubs"). Unset, as on fork pull
      # requests, buf treats the empty value as absent and runs anonymously.
      - run: make proto-check
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  # A generated project requires the kit release pinned in the cli-go
  # template. The release PR bumps the pin; this catches a release that
  # did not, against the proxy's list rather than local tags. Nightly
  # runs catch a release published since the last pull request.
  template-kit-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check-template-kit-pin

  # ── Stage 2: Test (after lint) ─────────────────────────────────
  go-test:
    needs: [go-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-go-integration
        # Property tests at 100 iterations on pull requests, full count
        # (1000) on pushes and the nightly schedule. The Makefile turns
        # PROPERTY_ITERATIONS into KIT_PROPERTY_ITERATIONS for go test.
        #
        # The trimmed pull-request count survived the test stores
        # dropping fsync (PRAGMA synchronous=OFF, engine/store's
        # newTestDocumentStore). That cut the full count from 349s to
        # 127-160s in a 4-CPU container on overlayfs — a real 2.4x, and
        # most of the durability cost: system time more than halved
        # (176s -> ~75s). It is still 2-3x what the gated run costs, on
        # the package whose runner variance produced the 1200s timeout
        # this gate was added for, so the full count stays off pull
        # requests. Note that a tmpfs scratch dir is not the way out
        # either: at the full count these tests write more than 2G of
        # throwaway databases, so the run dies with "database or disk
        # is full" on a 2G tmpfs before it finishes.
        env:
          PROPERTY_ITERATIONS: ${{ github.event_name == 'pull_request' && '100' || '' }}

  # Runs alongside go-test, not after it: the race detector roughly
  # doubles wall time, and go-test is already the long pole of the test
  # stage. As a sibling job the race gate costs the pipeline nothing it
  # was not already spending. Scope and the go/core/projects exclusion
  # are documented on the `test-go-race` target in the Makefile — CI and
  # a developer's local run share the one command.
  go-race:
    needs: [go-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-go-race

  ts-test:
    needs: [ts-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: make test-ts

  py-test:
    needs: [py-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
      - run: cd sdk/py && uv sync --all-extras --locked
      - run: cd engine/sdk/py-kit-engine && uv sync --all-extras --locked
      - run: make test-py

  rs-test:
    needs: [rs-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
      - run: make test-rs

  # The bus feature is embedded in multi-threaded and browser consumers.
  # Holds it to what they build: wasm32-unknown-unknown with no default
  # features, and no serde_json/preserve_order leaking out of `output`
  # (Cargo unifies features, so the leak would reorder every Map in the
  # consumer's tree). Bus tests run natively, plus smoke tests on
  # wasm32 itself under Node (tests/bus_wasm.rs and
  # tests/domain_statemachine_wasm.rs, `make test-rs-wasm`).
  rs-wasm:
    needs: [rs-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/experimental/rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features bus
      # clippy-wasm32/clippy.toml denies the std clock reads that panic
      # on this target, so a new SystemTime::now/Instant::now reachable
      # from the bus fails here instead of at run time in a browser.
      - name: clippy (wasm32, no clock reads)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features bus --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # The netpolicy core is the dependency-free half of the --offline
      # policy (no reqwest, no tokio), so a wasm client can check dials.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features bus,netpolicy
      - name: clippy (wasm32, bus and netpolicy)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features bus,netpolicy --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # The domain state machine builds on the bus alone; with no
      # spawner its post-transition event runs inline on this target.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features bus,netpolicy,domain
      - name: clippy (wasm32, bus, netpolicy and domain)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features bus,netpolicy,domain --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # Version order, the migration registry and the driver trait of
      # `upgrade` are pure; the runner is compiled off wasm32.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features upgrade
      - name: clippy (wasm32, upgrade)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features upgrade --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # The breaker builds on domain alone; it reads only the clock its
      # caller gives it, so the clock-read lint holds it to that here.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features breaker
      - name: clippy (wasm32, breaker)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features breaker --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # The consent core: grant model, decisions and the memory store.
      # The per-tool files and the relay (`consent-file`) are native only.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features consent
      - name: clippy (wasm32, consent)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features consent --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # The llm core (types, URIs, keys, registry, client) is
      # runtime-free; only the anthropic adapter is native.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features llm
      - name: clippy (wasm32, llm core)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features llm --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      # redact has no I/O: the default policy is embedded, so the
      # redactor runs in a browser or worker as it does natively.
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features --features redact
      - name: clippy (wasm32, redact)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features redact --lib -- -D warnings
        env:
          CLIPPY_CONF_DIR: clippy-wasm32
      - name: netpolicy pulls no reqwest or tokio
        run: |
          tree=$(cargo tree --locked -e normal --no-default-features --features netpolicy)
          if grep -qE '(reqwest|tokio) v' <<<"$tree"; then
            echo "$tree"
            echo "::error::--features netpolicy pulls reqwest or tokio"
            exit 1
          fi
      - name: bus does not enable serde_json/preserve_order
        run: |
          tree=$(cargo tree --locked -e normal,features --no-default-features --features bus -i serde_json)
          if grep -q preserve_order <<<"$tree"; then
            echo "$tree"
            echo "::error::--features bus enables serde_json/preserve_order"
            exit 1
          fi
      - run: cargo test --locked --no-default-features --features bus
      # wasm-bindgen-test-runner must be the wasm-bindgen version in
      # Cargo.lock, so the version is read from there, not pinned twice.
      - name: wasm-bindgen-cli matching Cargo.lock
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: wasm32 smoke test (Node)
        run: make test-rs-wasm
        working-directory: .

  # The bus feature also ships in mobile apps. A check is enough for the
  # bus: it is pure Rust. bus-network adds ring (rustls), whose build
  # script compiles C for the target: Xcode's iOS SDK on the macOS
  # runner, the NDK preinstalled on the Ubuntu runner.
  rs-mobile:
    needs: [rs-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/experimental/rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
          key: ${{ matrix.target }}
      - run: cargo check --locked --target "$TARGET" --no-default-features --features bus
        env:
          TARGET: ${{ matrix.target }}
      - name: check bus-network
        run: |
          if [ "$TARGET" = aarch64-linux-android ]; then
            bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
            export AR_aarch64_linux_android="$bin/llvm-ar"
          fi
          cargo check --locked --target "$TARGET" --no-default-features --features bus-network
        env:
          TARGET: ${{ matrix.target }}

  # make test-rs covers default and --all-features only. Both unify
  # features away from what a single-feature consumer builds: dev-deps
  # bring tokio `full`, and `output` brings serde_json/preserve_order.
  # These steps build features the way such a consumer does.
  rs-features:
    needs: [rs-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/experimental/rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
      # --lib leaves dev-dependencies out, so tokio carries only the
      # features each crate feature declares.
      - run: cargo check --locked --lib --no-default-features --features serve
      - run: cargo check --locked --lib --no-default-features --features telemetry
      # llm-anthropic declares only tokio's timer; the retry wait needs it.
      - run: cargo check --locked --lib --no-default-features --features llm-anthropic
      # mcp without output: serde_json keeps sorted maps.
      - run: cargo test --locked --no-default-features --features mcp

  php-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sdk/experimental/php's composer.json requires php ^8.4
      # (for jewei/typeid-php); ubuntu-latest ships 8.3 by default,
      # so pin explicitly. Matches the parity job's PHP setup below.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
      # composer only WARNS when composer.lock is stale, so drift never
      # fails a build — it just surfaces later as an unexplained warning
      # in someone else's install. --check-lock exits non-zero instead.
      - run: make lint-lock-php
      # Audits composer.lock for known advisories. Nothing failed the build
      # on a vulnerable dependency before this step, so 16 advisories piled
      # up unnoticed. Runs on the lock (no vendor/ needed) and gates at
      # medium+; see the audit-php target for the severity rationale.
      - run: make audit-php
      - run: cd sdk/experimental/php && composer install --no-progress
      # Static analysis. phpstan was in require-dev but never ran, so it
      # was installed on every build and enforced nothing. src/ gates at
      # level 5, tests/ at 2; see phpstan.neon for why they differ. No
      # baseline and no ignore list.
      - run: make lint-php
      # CrossLangSmokeTest currently fails on the anon-mode null
      # assertion (telemetry stack regression). Excluded here so the
      # gate ships green; re-enable once that test is fixed.
      - run: cd sdk/experimental/php && vendor/bin/phpunit --exclude-filter '/CrossLangSmokeTest/'

  # ── Stage 3: Parity (after all tests) ─────────────────────────
  parity:
    needs: [go-race, go-test, php-test, py-test, rs-features, rs-mobile, rs-test, rs-wasm, ts-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions from mise.toml, as a local `mise install` gets them.
      - id: pins
        run: scripts/toolchain-pins.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
      # Rust toolchain + cache for the typeid-v1 contract loader.
      # test-parity (via test-parity-typeid) runs
      # `cargo test --features id --test contract` on every build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # This action requires an explicit toolchain and runs
          # `rustup default` with it, so it does not read
          # sdk/experimental/rs/rust-toolchain.toml; the mise.toml pin
          # it reads is held equal to that file by
          # `make check-toolchain-parity`.
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/experimental/rs
      # PHP 8.4 toolchain for the typeid-v1 contract loader.
      # sdk/experimental/php's composer.json requires php ^8.4
      # (needed by jewei/typeid-php), and ubuntu-latest
      # ships PHP 8.3 by default, so we pin explicitly.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cd sdk/py && uv sync --all-extras --locked
      - run: make test-parity

  # ── Stage 4: Build + compliance (after parity) ────────────────
  compliance:
    needs: [parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -buildvcs=false -o spaced ./examples/spaced/go/
      - run: ./spaced compliance --spec examples/spaced/spaced.toolspec.yaml --format json
