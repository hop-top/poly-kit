name: release-please

# Runs on both integration branches with ONE committed config:
#   next → prereleases (*-alpha|beta|rc.N)
#   main → same prerelease config; stable x.y.z is cut deliberately, never
#          derived from the branch name
#
# Every package carries the prerelease triple (prerelease: true,
# prerelease-type, versioning: prerelease), so on either branch a plain merge
# advances the counter (alpha.N → alpha.N+1). To cut stable, land a
# conventional commit on main carrying a `Release-As: x.y.z` footer — that is
# the only thing that moves a version already on a prerelease track back to
# stable. Keeping the config byte-identical on both branches is what keeps
# next → main promotion merges conflict-free. See RELEASING.md.

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mint a short-lived installation token from the hop-top release-bot
      # GitHub App so the release PRs are opened by `release-bot[bot]`
      # rather than the human owner — sidesteps the CODEOWNERS
      # self-approval block on `.release-please-manifest.json`.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
