name: release-please

# The branch decides the version (target versioning, see RELEASING.md):
#   next         → prereleases; counter on the line, new line at alpha.0
#   main         → stable: rc packages cut to their target, stable ones
#                  patch-only, alpha/beta skipped
#   release/x.y  → LTS: patches only
# One committed config on every branch; nothing is patched per branch, so
# next → main merges stay conflict-free.
#
# googleapis/release-please-action does not know `versioning: "target"`: the
# shared workflow runs release-please with hop-top/.github's extension. It
# also carries the per-branch concurrency guard and the release-bot App token
# (release PRs by release-bot[bot] trigger downstream workflows and sidestep
# the CODEOWNERS self-approval block). Labels come from the config.
#
# Pin: the commit of hop-top/.github#87 (adds the extension, not merged yet;
# v0 has no extension, so `tooling-ref` names the same commit). Once #87
# lands, move both to the merged commit. scripts/promote-release.sh and
# release-promote-gate.yml read the pin from the `uses:` line;
# release-please-preflight.yml carries it too.

on:
  push:
    # release/<major>.<minor> only: the extension's maintenance role
    # (^release/\d+\.\d+$). Any other release/* branch has no role and would
    # fall back to prereleases. Filter globs: `+` repeats the preceding
    # character class, `.` is literal.
    branches: [main, next, 'release/[0-9]+.[0-9]+']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    uses: hop-top/.github/.github/workflows/release-please-on-push.yml@e90a473f1e9c8b0ad44000b29a36b78e2cffbe72
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    with:
      config-file: .github/release-please-config.json
      manifest-file: .github/.release-please-manifest.json
      versioning-extension: true
      tooling-ref: e90a473f1e9c8b0ad44000b29a36b78e2cffbe72
