name: publish

on:
  push:
    tags: ['*/v*']
  # Manual trigger: re-run a publish for an existing tag without
  # re-pushing. Replays against the workflow file at the tag's commit,
  # not main HEAD.
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: hop-top/.github/.github/workflows/publish-on-tag.yml@bd2a35bc97d3f288b0a7720ca5bb37d14221c729 # v0.17.0
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_REGISTRY_TOKEN: ${{ secrets.PYPI_REGISTRY_TOKEN }}
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      GH_MIRROR_PAT: ${{ secrets.GH_MIRROR_PAT }}
    with:
      homepage: https://github.com/hop-top/poly-kit
      description-prefix: "READ-ONLY MIRROR"
      ecosystems: |
        kit:
          dir: .
          ecosystem: go
          mirror: hop-top/kit
        mcp-tasks:
          dir: extensions/mcp-tasks
          ecosystem: go
          mirror: hop-top/mcp-tasks
        kit-php:
          dir: sdk/experimental/php
          ecosystem: php
          package: hop-top/kit
          mirror: hop-top/kit-php
        kit-py:
          dir: sdk/py
          ecosystem: py
          package: hop-top-kit
          mirror: hop-top/kit-py
          python-version: '3.11'  # toolchain-parity: allow (tests the requires-python floor, not the dev pin)
          test-command: pip install -e ".[dev]" && pytest
          # OIDC trusted publishing returned `invalid-publisher` despite
          # repeatedly correct pending-publisher claims (see uri-poly,
          # which hit the same and switched to token in
          # hop-top/.github#10). Use token auth until the PyPI side is
          # debugged; can revert to default oidc afterwards.
          pypi-auth: token
        kit-rs:
          dir: sdk/rs
          ecosystem: rs
          package: hop-top-kit
          mirror: hop-top/kit-rs
          # Deliberately floating, unlike CI's pinned lint/test jobs:
          # a release must compile on current stable so consumers can
          # build it. Publishing does not run fmt/clippy, which are the
          # version-sensitive gates.
          rust-toolchain: stable  # toolchain-parity: allow (floats on purpose; see above)
        kit-ts:
          dir: sdk/ts
          ecosystem: ts
          package: "@hop-top/kit"
          mirror: hop-top/kit-ts
          node-version: '24.22.1'
          # --exclude sqlstore.test.ts: depends on better-sqlite3
          # native bindings; --ignore-scripts blocks them. Mirrors
          # local `make test-ts`.
          test-command: pnpm install --frozen-lockfile --ignore-scripts && pnpm vitest run --exclude src/sqlstore.test.ts
        qmochi:
          dir: incubator/qmochi
          ecosystem: go
          mirror: hop-top/qmochi

  # Attach the `kit` binary archives + checksums.txt (.goreleaser.yaml) to
  # the `kit/v<version>` release: the engine SDKs download them from there.
  # `kit/v` holds the `/` boundary, so kit-py/kit-ts/... tags never match.
  goreleaser:
    if: startsWith(github.ref_name, 'kit/v')
    permissions:
      contents: write
    uses: hop-top/.github/.github/workflows/goreleaser-on-tag.yml@bd2a35bc97d3f288b0a7720ca5bb37d14221c729 # v0.17.0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    with:
      go-version: '1.27.3'

  # Proves the published crate builds from the registry, not from the
  # checkout: a fresh crate depends on the released version with the
  # features a CLI uses and compiles it. A failing build turns the
  # publish run red. `kit-rs/v` holds the `/` boundary like the
  # goreleaser gate above.
  rs-install-smoke:
    needs: publish
    if: startsWith(github.ref_name, 'kit-rs/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build a fresh crate against the registry release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#kit-rs/v}"
          dir=$(mktemp -d)
          cd "$dir"
          cargo new --bin smoke
          cd smoke
          cat >>Cargo.toml <<EOF
          hop-top-kit = { version = "=${version}", features = ["cli", "output", "serve-cli"] }
          EOF
          # The sparse index can trail `cargo publish` by a minute or so.
          for attempt in 1 2 3 4 5 6; do
            if cargo build; then
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::hop-top-kit ${version} did not build from the registry"
          exit 1
