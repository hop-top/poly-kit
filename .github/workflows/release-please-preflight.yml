name: release-please-preflight

# Catches release config drift at PR time instead of tag-push time.
# Delegates to the shared hop-top/.github workflow. Runs on every PR (no
# `paths:` filter) so it can be a required check: a required check whose
# workflow is filtered out never reports and leaves the PR pending.
#
# Pinned with release-please.yml to the same hop-top/.github release commit:
# a preflight older than the extension does not know `versioning: "target"`
# and fails the config. Move the pin together with release-please.yml's.
on:
  pull_request:
  workflow_dispatch: {}

# A newer push to a pull request cancels its older run; the new run
# reports the same checks. Pushes, the schedule and manual runs get a
# group of their own (the run id), so none is cancelled or queued behind
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    permissions:
      contents: read
    uses: hop-top/.github/.github/workflows/release-please-preflight.yml@5ce6680ccde9878428ed6cfa24e0e8f635d829a1 # v0.15.0
