name: Release Bump Check

# Holds release PRs to the repo's release rules, which release-please cannot
# enforce itself (RELEASING.md, "Breaking changes start a new minor line" and
# "Linked releases"):
#   - a breaking change since a component's last release starts a new minor
#     line, x.(y+1).0-alpha.0 (from 1.0, (x+1).0.0-alpha.0);
#   - a new major, or a new minor in pre-release, of a linked group member
#     releases every member at that version, in one PR;
#   - a PR never re-proposes a released version (a release-as pin or a
#     Release-As footer left behind).
# scripts/check-release-bump.sh does the work and prints the
# scripts/release-as.sh command that fixes a failure; the paths and refs come
# from its arguments, so a reusable workflow can call it the same way.
#
# It runs for every PR so it can be a required check: on a PR that is not a
# release PR the job is skipped, which GitHub counts as passing.
on:
  pull_request:
    branches: [main, next, 'release/**']

permissions:
  contents: read

jobs:
  breaking-bump:
    if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the check walks commits since each released
      # component's last tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release rules
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          scripts/check-release-bump.sh --branch "$BASE_REF"
          --head-ref "$HEAD_REF" "$BASE_SHA" "$HEAD_SHA"
