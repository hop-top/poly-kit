name: Nightly Release

# Auto-merges the open release-please PR on each integration branch when its
# CI is green:
#   next → the prerelease PR (release-please--branches--next)
#   main → the stable PR    (release-please--branches--main)
# One matrix leg per branch so both channels advance nightly.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  auto-merge-release:
    runs-on: ubuntu-latest
    if: ${{ vars.NIGHTLY_RELEASE != 'false' }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        branch: [main, next]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # release-please opens ONE PR PER PACKAGE, on branches named
      # release-please--branches--<branch>--components--<component>.
      # `gh pr list --head` is an exact match, so filtering on the bare
      # release-please--branches--<branch> prefix matched nothing and this
      # job silently no-opped. Select by base branch + bot author instead,
      # which is component-name agnostic, and iterate over every PR rather
      # than only the first.
      - name: Auto-merge release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail

          # `mapfile` is bash>=4 only; a plain read loop keeps this portable
          # and, more importantly, fails loudly rather than silently empty.
          PRS=$(gh pr list \
            --base "$BRANCH" \
            --author "app/hop-top-release-bot" \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--"))
                  | .number')

          if [ -z "$PRS" ]; then
            echo "No release-please PR found for $BRANCH"
            exit 0
          fi

          echo "Found release PR(s) for $BRANCH:" $PRS

          for PR_NUMBER in $PRS; do
            echo "::group::PR #$PR_NUMBER"

            CHECKS=$(gh pr checks "$PR_NUMBER" 2>&1 || true)
            if echo "$CHECKS" | grep -qE "fail|pending"; then
              echo "CI not green — skipping #$PR_NUMBER"
              echo "$CHECKS"
              echo "::endgroup::"
              continue
            fi
            echo "CI green — merging #$PR_NUMBER"

            # Plain merge (not squash): release-please PRs carry one commit
            # per package with its own Release-As trailer; squashing collapses
            # them and loses per-package version attribution.
            gh pr merge "$PR_NUMBER" \
              --merge \
              --auto \
              --subject "chore: release $BRANCH $(date +%Y-%m-%d)"

            echo "::endgroup::"
          done
