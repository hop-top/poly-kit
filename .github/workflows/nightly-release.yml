name: Nightly Release

# Auto-merges the open release-please PR on each integration branch when its
# CI is green:
#   next → the prerelease PR (release-please--branches--next)
#   main → the stable PR    (release-please--branches--main)
# One matrix leg per branch so both channels advance nightly.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  auto-merge-release:
    runs-on: ubuntu-latest
    if: ${{ vars.NIGHTLY_RELEASE != 'false' }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        branch: [main, next]
    steps:
      - uses: actions/checkout@v4

      - name: Find release-please PR
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: release-please--branches--${{ matrix.branch }}
        run: |
          PR=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base "${{ matrix.branch }}" \
            --json number,mergeable,mergeStateStatus \
            --jq '.[0]' 2>/dev/null || echo '{}')

          NUMBER=$(echo "$PR" | jq -r '.number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No release-please PR found for ${{ matrix.branch }}"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check CI status
        if: steps.find-pr.outputs.found == 'true'
        id: ci-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
        run: |
          CHECKS=$(gh pr checks "$PR_NUMBER" 2>&1 || true)

          if echo "$CHECKS" | grep -qE "fail|pending"; then
            echo "CI not green — skipping auto-merge"
            echo "$CHECKS"
            echo "green=false" >> "$GITHUB_OUTPUT"
          else
            echo "CI green"
            echo "green=true" >> "$GITHUB_OUTPUT"
          fi

      # Plain merge (not squash): release-please PRs carry one commit per
      # package with its own Release-As trailer; squashing collapses them and
      # loses per-package version attribution.
      - name: Auto-merge release PR
        if: >-
          steps.find-pr.outputs.found == 'true' &&
          steps.ci-check.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
          BRANCH: ${{ matrix.branch }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --auto \
            --subject "chore: release $BRANCH $(date +%Y-%m-%d)"
