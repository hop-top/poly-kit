version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"
    groups:
      # otelconnect pins an exact otel release and a connect floor; the otel
      # api, sdk and exporters must share a version: bump the set together.
      connect-otel:
        patterns: ["connectrpc.com/*", "go.opentelemetry.io/*"]

  - package-ecosystem: gomod
    directory: "/extensions/mcp-tasks"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"

  - package-ecosystem: gomod
    directory: "/incubator/qmochi"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"

  # pnpm workspace: the root lockfile covers sdk/ts, engine/sdk/ts-kit-engine
  # and the examples.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"
    ignore:
      # TypeScript 7 (native compiler) has no classic JS API; typescript-eslint
      # (peer <6.1) and tsup's dts build cannot run on it yet. Lift once
      # typescript-eslint supports 7 and the dts build works.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # v5 changes load semantics (empty docs throw, `<<` merge keys,
      # timestamps); needs a migration, not a bump.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
      # v13 segfaults on Node 22.12-22.13 (darwin-arm64) and still needs
      # node-gyp on Windows; revisit once upstream fixes land.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # Typings must not exceed the Node floor (engines >=22.12 in sdk/ts
      # and ts-kit-engine): a newer major types APIs the floor lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # server pins core exactly: they must move together.
      modelcontextprotocol:
        patterns: ["@modelcontextprotocol/*"]
      # vitest peers on vite; @vitest/* ship in lockstep with vitest.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
      # typescript-eslint and @typescript-eslint/* ship in lockstep.
      typescript-eslint:
        patterns: ["typescript-eslint", "@typescript-eslint/*"]

  - package-ecosystem: uv
    directory: "/sdk/py"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"
    groups:
      # mcp pins mcp-types exactly: they must move together.
      mcp:
        patterns: ["mcp", "mcp-types"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so mcp stays ahead of this catch-all.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/engine/sdk/py-kit-engine"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"

  - package-ecosystem: cargo
    directory: "/sdk/experimental/rs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"
    groups:
      # RustCrypto hash/KDF/MAC crates share the `digest` major: bump together.
      rustcrypto:
        patterns: ["sha2", "hkdf", "digest", "hmac"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so rustcrypto stays ahead of this catch-all.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on stable releases of the secretbox AEAD.
      - dependency-name: crypto_secretbox
        versions: [">= 0.2.0-pre.0, < 0.2.0"]

  - package-ecosystem: composer
    directory: "/sdk/experimental/php"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps):"
