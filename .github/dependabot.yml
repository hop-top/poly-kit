version: 2
# Every entry below sets:
#   cooldown         a new release is proposed only once it is 14 days old
#                    (the dependency age gate). It holds back version
#                    updates only: Dependabot security updates ignore it and
#                    open as soon as an advisory lands. Owned packages are
#                    excluded, as they are from the age gate.
#   rebase-strategy  disabled: an open PR is not rebased, and its CI not
#                    re-run, each time next moves. Comment `@dependabot
#                    rebase` on a PR to refresh it. This applies to security
#                    PRs as well.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop.top/*", "github.com/hop-top/*"]
    rebase-strategy: disabled
    groups:
      # otelconnect pins an exact otel release and a connect floor; the otel
      # api, sdk and exporters must share a version: bump the set together.
      connect-otel:
        patterns: ["connectrpc.com/*", "go.opentelemetry.io/*"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so the groups above stay ahead of this one.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: "/extensions/mcp-tasks"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop.top/*", "github.com/hop-top/*"]
    rebase-strategy: disabled
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: "/incubator/qmochi"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop.top/*", "github.com/hop-top/*"]
    rebase-strategy: disabled
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # "/" is the pnpm workspace: its lockfile covers sdk/ts,
  # engine/sdk/ts-kit-engine and examples/spaced/ts. The other directories
  # are standalone examples outside it (package-lock.json or none).
  - package-ecosystem: npm
    directories:
      - "/"
      - "/examples/notebook-ts"
      - "/examples/probe/ts"
      - "/examples/spaced/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["@hop-top/*"]
    rebase-strategy: disabled
    ignore:
      # TypeScript 7 (native compiler) has no classic JS API; typescript-eslint
      # (peer <6.1) and tsup's dts build cannot run on it yet. Lift once
      # typescript-eslint supports 7 and the dts build works.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # v5 changes load semantics (empty docs throw, `<<` merge keys,
      # timestamps); needs a migration, not a bump.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
      # v13 segfaults on Node 22.12-22.13 (darwin-arm64) and still needs
      # node-gyp on Windows; revisit once upstream fixes land.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # Typings track the better-sqlite3 major deferred above.
      - dependency-name: "@types/better-sqlite3"
        update-types: ["version-update:semver-major"]
      # Typings track the Node major in mise.toml, moved by hand with the
      # pin. They type APIs the engines floor (>=22.12 in sdk/ts and
      # ts-kit-engine) may lack; the Node-floor CI job guards that.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # server pins core exactly: they must move together.
      modelcontextprotocol:
        patterns: ["@modelcontextprotocol/*"]
      # vitest peers on vite; @vitest/* ship in lockstep with vitest.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
      # typescript-eslint and @typescript-eslint/* ship in lockstep.
      typescript-eslint:
        patterns: ["typescript-eslint", "@typescript-eslint/*"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so the groups above stay ahead of this one.
      # esbuild stays out: vite pins its range, so it gets its own PR.
      minor-patch:
        patterns: ["*"]
        exclude-patterns: ["esbuild"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/sdk/py"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    ignore:
      # ruff is a mise tool: the locked ruff must equal the mise.toml pin
      # (toolchain-parity). Moved by hand with the pin, never alone.
      - dependency-name: ruff
    groups:
      # mcp pins mcp-types exactly: they must move together.
      mcp:
        patterns: ["mcp", "mcp-types"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so mcp stays ahead of this catch-all.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/engine/sdk/py-kit-engine"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    ignore:
      # ruff is a mise tool: the locked ruff must equal the mise.toml pin
      # (toolchain-parity). Moved by hand with the pin, never alone.
      - dependency-name: ruff
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The cross-lang runner builds against the SDK by path and shares its
  # serde_json and tokio requirements.
  - package-ecosystem: cargo
    directories:
      - "/sdk/rs"
      - "/sdk/tests/cross-lang/runners/rs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    groups:
      # RustCrypto hash/KDF/MAC crates share the `digest` major: bump together.
      rustcrypto:
        patterns: ["sha2", "hkdf", "digest", "hmac"]
      # Everything else: one PR for minor + patch. A dependency joins the
      # first group it matches, so rustcrypto stays ahead of this catch-all.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on stable releases of the secretbox AEAD.
      - dependency-name: crypto_secretbox
        versions: [">= 0.2.0-pre.0, < 0.2.0"]

  # Example apps: pyproject.toml without a uv.lock.
  - package-ecosystem: pip
    directories:
      - "/examples/probe/py"
      - "/examples/spaced/py"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: composer
    directory: "/sdk/experimental/php"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top/*"]
    rebase-strategy: disabled
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow and composite-action `uses:` refs: every one is pinned to a
  # commit SHA with its version in a trailing comment (make
  # lint-actions-pinned); Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top/*"]
    rebase-strategy: disabled
    ignore:
      # The release-please pin must match `tooling-ref` and the preflight
      # pin (see release-please.yml); moved by hand, all three together.
      # Reusable workflows are named by their path, so match those too.
      - dependency-name: "hop-top/.github"
      - dependency-name: "hop-top/.github/.github/workflows/release-please-*"
    groups:
      # One PR per run for minor + patch; majors stay separate for review.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
